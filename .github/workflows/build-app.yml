name: 앱 빌드

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: APK 빌드
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DivRadar.apk

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: 다이버전스 레이더 앱 (최신)
          body: |
            폰에서 아래 DivRadar.apk 를 눌러 내려받고 설치하세요.
            빌드 시각: ${{ github.event.head_commit.timestamp || github.run_started_at }}
          files: DivRadar.apk
          make_latest: true
