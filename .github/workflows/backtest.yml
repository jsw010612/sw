name: 백테스트

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "전략"
        type: choice
        options: ["진입검증", "단기스윙", "조합탐색", "혼합매도", "손절분석", "점수분석", "매도분석", "통합", "파동하모닉", "이평선지지", "프랙탈", "횡보돌파", "바닥반등"]
        default: "진입검증"
      years:
        description: "기간 (년)"
        default: "5"
      top:
        description: "시총 상위 몇 종목 (전 종목은 3000)"
        default: "3000"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          pip install finance-datareader || true

      - name: 백테스트
        env:
          BT_MODE: ${{ github.event.inputs.mode }}
          BT_YEARS: ${{ github.event.inputs.years }}
          BT_TOP: ${{ github.event.inputs.top }}
        run: python backtest.py

      - name: 결과 저장
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state
          git commit -m "백테스트 결과 $(TZ=Asia/Seoul date '+%m/%d %H:%M')" || echo "변경 없음"
          git pull --rebase origin main || true
          git push
