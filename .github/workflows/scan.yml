name: 다이버전스 스캐너

on:
  schedule:
    # 시간은 UTC 기준 (한국 시간 = UTC + 9)
    - cron: "40 23 * * 0-4"   # 08:40 장 전 후보 추리기 (알림 없음)
    - cron: "2 0-6 * * 1-5"   # 09:02 ~ 15:02 매시간: 매수 신호 + TOP20 요약
    - cron: "32 0-6 * * 1-5"  # 09:32 ~ 15:32 매시간: 매수 신호만
    - cron: "45 6 * * 1-5"    # 15:45 장 마감 후: 매수 신호 + TOP20 요약
  workflow_dispatch:   # Actions 탭에서 "Run workflow"로 바로 실행

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 스캔
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_STAGE: ${{ vars.MIN_STAGE || '3' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '85' }}
          WATCH_SCORE: ${{ vars.WATCH_SCORE || '70' }}
          UNIVERSE: ${{ vars.UNIVERSE || 'ALL' }}
          SUMMARY: ${{ vars.SUMMARY || '1' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: python scan.py

      - name: 결과 저장
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state
          git commit -m "스캔 결과 $(TZ=Asia/Seoul date '+%m/%d %H:%M')" || echo "변경 없음"
          # 실행 중에 앱에서 관심·보유를 바꿨으면 먼저 받아서 합침
          git pull --rebase origin main || true
          git push
