name: 다이버전스 스캐너

on:
  schedule:
    # 평일 09:05 ~ 15:05 (한국 시간) 매시간 + 장 마감 후 15:45
    - cron: "5 0-6 * * 1-5"
    - cron: "45 6 * * 1-5"
  workflow_dispatch:   # Actions 탭에서 "Run workflow"로 바로 실행

permissions:
  contents: write

concurrency:
  group: scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 스캔
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MIN_STAGE: ${{ vars.MIN_STAGE || '3' }}
          MIN_SCORE: ${{ vars.MIN_SCORE || '85' }}
          WATCH_SCORE: ${{ vars.WATCH_SCORE || '70' }}
          UNIVERSE: ${{ vars.UNIVERSE || 'ALL' }}
          SUMMARY: ${{ vars.SUMMARY || '1' }}
        run: python scan.py

      - name: 결과 저장
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state
          git commit -m "스캔 결과 $(TZ=Asia/Seoul date '+%m/%d %H:%M')" || echo "변경 없음"
          git push
