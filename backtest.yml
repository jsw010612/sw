name: 백테스트

on:
  workflow_dispatch:
    inputs:
      years:
        description: "기간 (년)"
        default: "3"
      top:
        description: "시총 상위 몇 종목"
        default: "500"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 백테스트
        env:
          BT_YEARS: ${{ github.event.inputs.years }}
          BT_TOP: ${{ github.event.inputs.top }}
        run: python backtest.py

      - name: 결과 저장
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state/backtest.md state/backtest_trades.csv
          git commit -m "백테스트 결과 $(TZ=Asia/Seoul date '+%m/%d %H:%M')" || echo "변경 없음"
          git pull --rebase origin main || true
          git push
