plugins {
    id 'com.android.application'
}

android {
    namespace 'com.divradar.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.divradar.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // 매번 같은 서명으로 빌드해야 앱을 지우지 않고 업데이트할 수 있어요
    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
