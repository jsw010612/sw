<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다이버전스 레이더</title>
<style>
  :root{
    --bg:#0c0f14; --card:#151a21; --card2:#1b222b; --line:#252d38;
    --tx:#e8edf3; --mu:#8a96a6; --mu2:#5d6877;
    --ok:#36d399; --ok-bg:rgba(54,211,153,.14);
    --near:#f5c451; --near-bg:rgba(245,196,81,.14);
    --sig:#ffcf5a; --up:#ff5c62; --dn:#4c8dff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);
    font-family:Pretendard,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
    font-size:15px;letter-spacing:-.01em}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 90px}

  header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,rgba(12,15,20,0));
    padding:18px 16px 10px;margin:0 -16px}
  .hrow{display:flex;align-items:center;justify-content:space-between}
  h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.03em}
  h1 span{color:var(--ok)}
  .meta{color:var(--mu);font-size:12.5px;margin-top:4px}
  .icons{display:flex;gap:6px}
  .ib{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
  .ib svg{width:19px;height:19px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .spin svg{animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .tabs{display:flex;gap:6px;margin-top:14px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--line)}
  .tab{flex:1;padding:9px 0;border-radius:10px;font-weight:700;font-size:14px;color:var(--mu)}
  .tab.on{background:var(--card2);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
  .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--sig);color:#1a1300;font-size:11.5px;line-height:18px}
  .chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--mu);font-size:13px}
  .chip.on{border-color:var(--tx);color:var(--tx)}

  .demo{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--near-bg);color:var(--near);font-size:13px}
  .demo b{text-decoration:underline}

  .list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:grid;
    grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%}
  .card.sig{border-color:rgba(255,207,90,.45);background:linear-gradient(160deg,rgba(255,207,90,.08),var(--card) 55%)}
  .rank{grid-column:1;grid-row:1/3;width:22px;color:var(--mu2);font-weight:800;font-size:15px;text-align:center}
  .nm{grid-column:2;grid-row:1;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;min-width:0}
  .nm i{font-style:normal;font-weight:600;font-size:11px;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:1px 5px;flex:none}
  .nm s{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .px{font-size:13px;color:var(--mu);margin-top:2px}
  .card .px{grid-column:2;grid-row:2}
  .px .u{color:var(--up)} .px .d{color:var(--dn)}
  .ring{grid-column:3;grid-row:1/3;position:relative;width:52px;height:52px}
  .ring svg{width:52px;height:52px;transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800}
  .ring small{position:absolute;left:0;right:0;bottom:-13px;text-align:center;font-size:10px;color:var(--mu)}
  .row2{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .pills{display:flex;gap:4px}
  .pill{font-size:11px;padding:3px 6px;border-radius:7px;background:var(--card2);color:var(--mu);text-align:center;min-width:36px}
  .pill em{display:block;font-style:normal;font-weight:800;font-size:12.5px;color:var(--tx)}
  .pill.os{background:var(--ok-bg)} .pill.os em{color:var(--ok)}
  .pill.nr{background:var(--near-bg)} .pill.nr em{color:var(--near)}
  .pill.top{outline:1.5px solid var(--tx)}
  .st{font-size:12px;color:var(--mu);text-align:right;line-height:1.35}
  .st b{color:var(--tx);font-weight:700}
  .st .g{color:var(--sig)}
  .empty{color:var(--mu);text-align:center;padding:60px 10px;line-height:1.7}

  /* 상세 팝업 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  .dim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow:auto;background:#12171e;
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
    padding:10px 18px 28px;max-width:560px;margin:0 auto}
  .sheet.on{transform:none}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sh-h{display:flex;justify-content:space-between;align-items:flex-start}
  .sh-h h2{margin:0;font-size:22px;letter-spacing:-.03em}
  .sh-h .px{font-size:14px}
  .x{width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center}
  .scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 6px}
  .sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .sc .l{font-size:12px;color:var(--mu)}
  .sc .v{font-size:26px;font-weight:800;margin-top:2px}
  .sc .v small{font-size:13px;color:var(--mu);font-weight:600;margin-left:4px}
  .sc.gold .v{color:var(--sig)}
  .sec{margin-top:18px}
  .sec h3{font-size:13px;color:var(--mu);font-weight:700;margin:0 0 8px}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:58px 1fr 40px;gap:8px;align-items:center;font-size:13px}
  .bar .t{color:var(--mu)}
  .bar .tr{height:8px;border-radius:4px;background:var(--card2);position:relative;overflow:hidden}
  .bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--mu2)}
  .bar .tr i.os{background:var(--ok)} .bar .tr i.nr{background:var(--near)}
  .bar .tr u{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.25)}
  .bar b{text-align:right}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px 4px}
  .chart svg{width:100%;height:auto;display:block}
  .chk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ck{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px;display:flex;gap:7px;align-items:center}
  .ck i{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;flex:none;background:var(--card2);color:var(--mu2)}
  .ck.y i{background:var(--ok);color:#06261a}
  .info{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .info div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13.5px;border-top:1px solid var(--line)}
  .info div:first-child{border-top:0}
  .info span{color:var(--mu);flex:none}
  .info b{font-weight:600;text-align:right}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
  .btn{padding:13px 0;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700}
  .btn.p{background:var(--ok);color:#06261a;border-color:var(--ok)}
  .fld{width:100%;margin-top:8px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
  .hint{font-size:13px;color:var(--mu);line-height:1.6;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.25s;background:#26303c;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:40}
  .toast.on{opacity:1;transform:translateX(-50%)}
  .fg{font-style:normal;font-weight:800;font-size:11px;border-radius:6px;padding:1px 6px;flex:none}
  .fg.A{background:rgba(54,211,153,.16);color:#36d399} .fg.B{background:rgba(76,141,255,.16);color:#7aa9ff}
  .fg.C{background:rgba(245,196,81,.16);color:#f5c451} .fg.D{background:rgba(255,150,80,.16);color:#ff9a5a}
  .fg.R{background:rgba(255,92,98,.18);color:#ff5c62} .fg.N{background:var(--card2);color:var(--mu)}
  .chip.warn.on{border-color:#ff5c62;color:#ff5c62}
  .fin-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .fin-h .big{font-size:26px;font-weight:800}
  .flags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
  .flag{background:rgba(255,92,98,.14);color:#ff7b80;border-radius:8px;padding:4px 8px;font-size:12.5px;font-weight:700}
  .ftab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;background:var(--card);border-radius:12px;overflow:hidden}
  .ftab th,.ftab td{padding:7px 8px;text-align:right;border-top:1px solid var(--line)}
  .ftab th{color:var(--mu);font-weight:600}
  .ftab td:first-child,.ftab th:first-child{text-align:left;color:var(--mu)}
  .ftab tr:first-child th{border-top:0}
  .neg{color:var(--dn)}
  .note{font-size:11.5px;color:var(--mu2);margin-top:6px}
  .card.wait{border-color:rgba(154,168,255,.4)}
  .st .w,.w{color:#9aa8ff} .r{color:#ff7b80}
  .mk{font-style:normal;font-weight:800;font-size:11px;border-radius:6px;padding:1px 6px;flex:none;background:rgba(154,168,255,.16);color:#9aa8ff}
  .mk.h{background:rgba(255,207,90,.16);color:var(--sig)}
  .badge.b2{background:#9aa8ff;color:#0c0f14}
  .sub{font-size:12.5px;color:var(--mu);font-weight:700;margin:8px 2px 0}
  .card.mine .rank{font-size:11px;width:28px;color:var(--sig)}
  .mline{grid-column:2/3;font-size:12px;color:var(--mu);margin-top:10px;line-height:1.5}
  .sc.waitc .v{color:#9aa8ff}
  .wbox{margin-top:12px;padding:11px 12px;border-radius:12px;background:rgba(154,168,255,.1);color:#c4cbff;font-size:13px;line-height:1.5}
  .avgrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
  .avgrow .fld{margin-top:0}
  .avgrow .btn{padding:13px 16px;margin:0}
  .res{margin-top:10px;display:flex;flex-direction:column;gap:6px}
  .ri{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;width:100%}
  .ri small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
  .ri span{font-size:12px;color:var(--mu);flex:none}
  .icons .ib{width:36px;height:36px}
</style>
</head>

  return `<div class="ring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" stroke="var(--card2)" stroke-width="5" fill="none"/>
    <circle cx="26" cy="26" r="22" stroke="${col}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
    <b>${v}</b><small>${lab}</small></div>`;
}
function pills(it){
  return FR.map((f, k) => `<div class="pill ${rcls(it.rsi[k])} ${k === it.base ? "top" : ""}">${f.replace("시간","h")}<em>${it.rsi[k] == null ? "-" : Math.round(it.rsi[k])}</em></div>`).join("");
}
function card(it, i, mode){
  const up = (it.chg || 0) >= 0;
  const cls = it.type === "매수" ? "sig" : it.type === "대기" ? "wait" : "";
  const mark = isHeld(it.code) ? `<i class="mk h">보유</i>` : isWatched(it.code) ? `<i class="mk">관심</i>` : "";
  const ringV = mode === "sig" ? it.signal : it.ready, ringK = mode === "sig" ? it.type : null;
  return `<button class="card ${cls}" data-c="${it.code}">
    <div class="rank">${i + 1}</div>
    <div class="nm"><s>${esc(it.name)}</s><i>${it.market}</i>${fbadge(it)}${mark}</div>
    ${ring(ringV, ringK)}
    <div class="px">${fmt(it.price)}원 <span class="${up ? "u" : "d"}">${up ? "+" : ""}${f1(it.chg)}%</span></div>
    <div class="row2"><div class="pills">${pills(it)}</div><div class="st">${status(it)}</div></div>
  </button>`;
}
function mineCard(h, kind){
  const it = (DATA.items || []).find(x => x.code === h.code);
  const price = it ? it.price : null;
  const pct = (kind === "보유" && h.avg && price) ? (price / h.avg - 1) * 100 : null;
  const pc = pct == null ? "" : `<span class="${pct >= 0 ? "u" : "d"}">${pct >= 0 ? "+" : ""}${f1(pct)}%</span>`;
  let st = it ? status(it) : `<b>분석 대기</b><br>다음 실행 때 분석돼요`;
  if (it && it.exit) st = `<b class="r">익절 신호 · ${FR[it.exit.frame_idx]} 과매수 다이버전스</b><br>${st.split("<br>")[0]}`;
  const lines = [];
  if (kind === "보유" && h.avg){
    lines.push(`평단 ${fmt(h.avg)}`);
    lines.push(`손절 ${fmt(h.avg * 0.97)} / ${fmt(h.avg * 0.95)}`);
    const h4 = h.h4 || (it && it.forming && it.forming.h4);
    if (h4) lines.push(`1차 익절 ${fmt(h4)}`);
  }
  return `<button class="card mine" data-c="${h.code}">
    <div class="rank">${kind === "보유" ? "보유" : "관심"}</div>
    <div class="nm"><s>${esc(h.name || (it && it.name) || h.code)}</s>${it ? `<i>${it.market}</i>` : ""}${it ? fbadge(it) : ""}</div>
    ${it ? ring(it.ready, null) : `<div class="ring"></div>`}
    <div class="px">${price ? fmt(price) + "원 " : ""}${pc}</div>
    ${lines.length ? `<div class="mline">${lines.join(" · ")}</div>` : ""}
    <div class="row2">${it ? `<div class="pills">${pills(it)}</div>` : "<div></div>"}<div class="st">${st}</div></div>
  </button>`;
}

function render(){
  if (!DATA){ $("#list").innerHTML = `<div class="empty">아직 결과가 없어요.<br>스캐너가 한 번 돌고 나면 여기에 떠요.</div>`; $("#meta").textContent = ""; return; }

    $("#list").innerHTML = (hs.length || ws.length)

      : `<div class="empty">아직 등록한 종목이 없어요.<br>위쪽 🔍 검색에서 종목을 찾아<br>관심이나 보유로 추가해 보세요.</div>`;
  } else {

    if (HIDE) arr = arr.filter(x => !(x.fin && x.fin.grade === "위험"));
    arr = arr.slice().sort(TAB === "sig"
      ? (a, b) => ((b.type === "매수") - (a.type === "매수")) || (b.signal - a.signal)

    $("#list").innerHTML = arr.length ? arr.map((it, i) => card(it, i, TAB)).join("")
      : `<div class="empty">${TAB === "sig" ? "지금은 매수·대기 신호가 없어요.<br>준비 순위에서 가까운 종목을 확인해 보세요." : "조건에 맞는 종목이 없어요."}</div>`;

  if (PENDING){ const c = PENDING; PENDING = null; openDetail(c); }
}

function chartSvg(fm){
  const s = fm.spark || []; if (s.length < 5) return "";
  const W = 340, H = 160, pl = 6, pr = 48, pt = 16, pb = 20;
  let lo = Math.min(...s), hi = Math.max(...s);
  if (fm.target_lo != null) lo = Math.min(lo, fm.target_lo);
  if (fm.h4 != null) hi = Math.max(hi, fm.h4);
  const pad = (hi - lo) * .06; lo -= pad; hi += pad;
  const X = i => pl + i * (W - pl - pr) / (s.length - 1), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const path = s.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const area = `${path}L${X(s.length-1)},${H-pb}L${X(0)},${H-pb}Z`;
  let g = `<defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36d399" stop-opacity=".22"/><stop offset="1" stop-color="#36d399" stop-opacity="0"/></linearGradient></defs>`;
  if (fm.target_hi != null && fm.i_h4 != null && fm.i_h4 >= 0){
    const x0 = X(Math.max(0, fm.i_h4)), y0 = Y(fm.target_hi), y1 = Y(fm.target_lo);
    g += `<rect x="${x0}" y="${y0}" width="${W - pr - x0}" height="${Math.max(2, y1 - y0)}" fill="rgba(245,196,81,.13)" stroke="rgba(245,196,81,.5)" stroke-dasharray="3 3"/>`;
    g += `<text x="${x0 + 3}" y="${y1 + 12}" fill="#f5c451" font-size="10">5파 목표</text>`;
  }
  if (fm.l3p != null){
    g += `<line x1="${pl}" x2="${W - pr}" y1="${Y(fm.l3p)}" y2="${Y(fm.l3p)}" stroke="#5d6877" stroke-dasharray="2 4"/>`;
  }
  g += `<path d="${area}" fill="url(#ga)"/><path d="${path}" fill="none" stroke="#e8edf3" stroke-width="1.6"/>`;
  const mk = (i, v, t, col, below) => {
    if (i == null || i < 0 || i >= s.length) return "";
    const x = X(i), y = Y(v);
    return `<circle cx="${x}" cy="${y}" r="4" fill="${col}" stroke="#12171e" stroke-width="2"/>
      <text x="${x}" y="${below ? y + 15 : y - 8}" text-anchor="middle" fill="${col}" font-size="10.5" font-weight="700">${t}</text>`;
  };
  g += mk(fm.i_l3, fm.l3p, "3파", "#36d399", true);
  g += mk(fm.i_h4, fm.h4, "4파", "#8a96a6", false);
  if (fm.below) g += mk(fm.i_low, fm.low, fm._sig ? "5파" : "5파?", "#ffcf5a", false);
  const last = s[s.length - 1];
  g += `<text x="${W - pr + 4}" y="${Y(last) + 4}" fill="#e8edf3" font-size="10">${fmt(last)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function finSection(it){
  const f = it.fin;
  if (!f) return `<div class="sec"><h3>재무 건강 <span style="font-weight:500">(참고)</span></h3><div class="info"><div><span>재무</span><b>상위 종목만 재무를 확인해요</b></div></div></div>`;
  const g = f.grade, cls = g === "위험" ? "R" : g === "정보없음" ? "N" : g;
  const parts = Object.entries(f.parts || {}).map(([k, [v, m]]) => {
    const w = m ? Math.round(v / m * 100) : 0;
    return `<div class="bar"><span class="t">${k}</span><div class="tr"><i class="${w >= 70 ? "os" : w >= 40 ? "nr" : ""}" style="width:${Math.max(2, w)}%"></i></div><b>${v}/${m}</b></div>`;
  }).join("");
  const flags = (f.flags || []).map(x => `<span class="flag">⚠ ${esc(x)}</span>`).join("");
  const ys = f.years || [];
  const R = [["매출액","rev",0],["영업이익","op",0],["순이익","ni",0],["ROE %","roe",1],["부채비율 %","debt",0],["당좌비율 %","quick",0],["유보율 %","reserve",0],["PER","per",1],["PBR","pbr",2]];
  const cell = (v, d) => v == null ? "-" : `<span class="${v < 0 ? "neg" : ""}">${Number(v).toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d})}</span>`;
  const table = ys.length ? `<table class="ftab"><tr><th></th>${ys.map(y => `<th>${esc(String(y.y).slice(0, 7))}</th>`).join("")}</tr>` +
    R.map(([t, k, d]) => `<tr><td>${t}</td>${ys.map(y => `<td>${cell(y[k], d)}</td>`).join("")}</tr>`).join("") + `</table>` : "";
  return `<div class="sec"><h3>재무 건강 <span style="font-weight:500">(참고)</span></h3>
    <div class="fin-h"><span class="big">${f.score == null ? "-" : f.score}<small style="font-size:13px;color:var(--mu)">/100</small></span><i class="fg ${cls}" style="font-size:13px;padding:3px 9px">${g === "위험" ? "⚠ 위험" : g}</i></div>
    ${flags ? `<div class="flags">${flags}</div>` : ""}
    <div class="bars">${parts}</div>${table}
    <div class="note">단위: 억원 · 최근 연간 실적 (네이버 금융) · 투자 판단은 직접 확인하세요</div></div>`;
}

function bindMine(it, code, name, market){
  const h4 = it && it.sig ? it.sig.h4 : null;
  $("#hold").onclick = async () => { const v = parseFloat(String($("#avg").value).replace(/,/g, "")); if (!(v > 0)) { toast("평단가를 숫자로 넣어 주세요"); return; } await setHolding(code, name, market, v, h4); openDetail(code); };
  $("#wbtn").onclick = async () => { await toggleWatch(code, name, market); openDetail(code); };
  $("#unhold").onclick = async () => { if (!isHeld(code)) return; await setHolding(code, name, market, 0); openDetail(code); };

  const C = (ok, t) => `<div class="ck ${ok ? "y" : ""}"><i>${ok ? "✓" : "–"}</i>${t}</div>`;

    : [C(fm.l3p != null,"3파 저점 확인"), C(fm.v3,"3파 거래량 급증"), C(fm.below,"3파 저점 이탈"), C(fm.rsi_div,"RSI 다이버전스"), C(fm.vol_shrink,"거래량 감소"), C((fm.depth||0) >= 1.222,"5파 목표 도달"),

    <div class="sec"><h3>${sf} 차트 · 파동 구조</h3><div class="chart">${chartSvg(Object.assign({}, fm, {_sig: !!sg})) || `<div class="empty" style="padding:24px">차트 데이터 없음</div>`}</div></div>
    <div class="sec"><h3>프레임별 RSI <span style="font-weight:500">(점선 30 · 35 · 주봉 40)</span></h3><div class="bars">${bars}</div></div>
    <div class="sec"><h3>${sg ? "신호 조건" : "진행 상황"}</h3><div class="chk">${checks.join("")}</div></div>
    <div class="sec"><h3>파동 정보</h3><div class="info">${rows}</div></div>
    ${mineSection(it, it.code, it.name, it.market === "코스닥" ? "KQ" : "KS")}
    ${finSection(it)}
    <div class="btns">
      <button class="btn" id="bn">네이버 차트</button>
      <button class="btn p" id="bt">트레이딩뷰</button>
    </div>`;
  $("#cx").onclick = closeSheet;
  $("#bn").onclick = () => openUrl(`https://m.stock.naver.com/domestic/stock/${it.code}/total`);
  $("#bt").onclick = () => openUrl(`https://www.tradingview.com/chart/?symbol=KRX%3A${it.code}`);
  bindMine(it, it.code, it.name, it.market === "코스닥" ? "KQ" : "KS");
  showSheet();
}

// ---------- 검색 ----------
async function loadUni(){
  if (UNI) return UNI;
  try { UNI = JSON.parse(ls("uni")); } catch(e){ UNI = null; }
  const fresh = await ghGet("state/universe.json", true);
  if (Array.isArray(fresh)) { UNI = fresh; ls("uni", JSON.stringify(fresh)); }
  if (!UNI) UNI = (DATA && DATA.items || []).map(x => ({c: x.code, n: x.name, m: x.market === "코스닥" ? "KQ" : "KS"}));
  return UNI;
}
async function openSearch(){
  $("#sheet").innerHTML = `<div class="grab"></div>
    <div class="sh-h"><h2>종목 검색</h2><button class="x" id="cx">✕</button></div>
    <input class="fld" id="q" placeholder="종목명 또는 코드 (예: 삼성, 005930)" autocomplete="off">
    <div class="res" id="res"><div class="hint">전 종목 목록을 불러오는 중…</div></div>`;
  $("#cx").onclick = closeSheet; showSheet();
  setTimeout(() => $("#q").focus(), 250);
  await loadUni();
  const draw = () => {
    const q = $("#q").value.trim().toLowerCase();
    if (!q){ $("#res").innerHTML = `<div class="hint">${UNI.length.toLocaleString()}개 종목에서 찾아요. 결과 목록에 없는 종목도 관심·보유로 추가하면 다음 실행부터 분석돼요.</div>`; return; }
    const hit = UNI.filter(u => u.c.includes(q) || u.n.toLowerCase().includes(q)).slice(0, 40);
    $("#res").innerHTML = hit.length ? hit.map(u => {
      const it = (DATA.items || []).find(x => x.code === u.c);
      const tag = isHeld(u.c) ? `<i class="mk h">보유</i>` : isWatched(u.c) ? `<i class="mk">관심</i>` : "";
      return `<button class="ri" data-c="${u.c}" data-n="${esc(u.n)}" data-m="${u.m}"><div><b>${esc(u.n)}</b> ${tag}<small>${u.c} · ${u.m === "KQ" ? "코스닥" : "코스피"}</small></div>
        <span>${it ? `준비 ${it.ready}${it.type ? ` · ${it.type} ${it.signal}` : ""}` : "목록 밖"}</span></button>`;
    }).join("") : `<div class="hint">찾는 종목이 없어요.</div>`;
    document.querySelectorAll(".ri").forEach(el => el.onclick = () => openDetail(el.dataset.c, el.dataset.n, el.dataset.m));
  };
  $("#q").oninput = draw; draw();
}

function openSettings(){
  $("#sheet").innerHTML = `<div class="grab"></div>
    <div class="sh-h"><h2>설정</h2><button class="x" id="cx">✕</button></div>
    <div class="sec"><h3>GitHub 저장소</h3>
      <input class="fld" id="repo" placeholder="아이디/저장소이름  예) jsw010612/sw" value="${esc(getRepo())}" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="hint">스캐너를 올린 공개 저장소예요. 위젯도 같은 저장소에서 결과를 가져와요.</div>
    </div>
    <div class="sec"><h3>GitHub 토큰 <span style="font-weight:500">(관심·보유 저장용)</span></h3>
      <input class="fld" id="tok" type="password" placeholder="github_pat_로 시작하는 토큰" value="${esc(getToken())}" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="hint">관심·보유 종목을 저장소에 저장해야 스캐너가 손절선·익절 알림을 보낼 수 있어요. 토큰은 이 기기에만 저장돼요.<br>
      만드는 법: GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token → Repository access에서 이 저장소만 선택 → Permissions의 Contents를 Read and write로.</div>
    </div>
    <div class="btns"><button class="btn" id="clr">예시로 보기</button><button class="btn p" id="sv">저장</button></div>`;
  $("#cx").onclick = closeSheet;
  $("#sv").onclick = () => { const v = $("#repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/+$/, ""); setRepo(v); ls("ghtoken", $("#tok").value.trim()); UNI = null; closeSheet(); toast("저장했어요"); load(); };
  $("#clr").onclick = () => { setRepo(""); closeSheet(); load(); };
  showSheet();
}

function showSheet(){ $("#dim").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").scrollTop = 0; }
function closeSheet(){ $("#dim").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#dim").onclick = closeSheet;
$("#rf").onclick = load;
$("#set").onclick = openSettings;
$("#srch").onclick = openSearch;
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); TAB = b.dataset.t; render(); });
$("#hideRisk").classList.toggle("on", HIDE);
$("#hideRisk").onclick = () => { HIDE = !HIDE; $("#hideRisk").classList.toggle("on", HIDE); ls("hideRisk", HIDE ? "1" : "0"); render(); };
document.querySelectorAll(".chip[data-m]").forEach(b => b.onclick = () => { document.querySelectorAll(".chip[data-m]").forEach(x => x.classList.toggle("on", x === b)); MKT = b.dataset.m; render(); });

window.openCode = code => { if (DATA) openDetail(code); else PENDING = code; };
window.onBack = () => { if ($("#sheet").classList.contains("on")) { closeSheet(); return true; } return false; };
window.reload = load;
try { const c = new URLSearchParams(location.search).get("code"); if (c) PENDING = c; } catch(e){}
load();
</script>
</body>
</html>
