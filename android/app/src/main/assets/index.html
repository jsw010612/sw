<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다이버전스 레이더</title>
<style>
  :root{
    --bg:#0c0f14; --card:#151a21; --card2:#1b222b; --line:#252d38;
    --tx:#e8edf3; --mu:#8a96a6; --mu2:#5d6877;
    --ok:#36d399; --ok-bg:rgba(54,211,153,.14);
    --near:#f5c451; --near-bg:rgba(245,196,81,.14);
    --sig:#ffcf5a; --up:#ff5c62; --dn:#4c8dff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);
    font-family:Pretendard,-apple-system,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
    font-size:15px;letter-spacing:-.01em}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px 90px}

  header{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,rgba(12,15,20,0));
    padding:18px 16px 10px;margin:0 -16px}
  .hrow{display:flex;align-items:center;justify-content:space-between}
  h1{font-size:21px;font-weight:800;margin:0;letter-spacing:-.03em}
  h1 span{color:var(--ok)}
  .meta{color:var(--mu);font-size:12.5px;margin-top:4px}
  .icons{display:flex;gap:6px}
  .ib{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
  .ib svg{width:19px;height:19px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .spin svg{animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .tabs{display:flex;gap:6px;margin-top:14px;background:var(--card);padding:4px;border-radius:14px;border:1px solid var(--line)}
  .tab{flex:1;padding:9px 0;border-radius:10px;font-weight:700;font-size:14px;color:var(--mu)}
  .tab.on{background:var(--card2);color:var(--tx);box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
  .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--sig);color:#1a1300;font-size:11.5px;line-height:18px}
  .chips{display:flex;gap:6px;margin-top:10px}
  .chip{padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--mu);font-size:13px}
  .chip.on{border-color:var(--tx);color:var(--tx)}

  .demo{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--near-bg);color:var(--near);font-size:13px}
  .demo b{text-decoration:underline}

  .list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px;display:grid;
    grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;text-align:left;width:100%}
  .card.sig{border-color:rgba(255,207,90,.45);background:linear-gradient(160deg,rgba(255,207,90,.08),var(--card) 55%)}
  .rank{grid-column:1;grid-row:1/3;width:22px;color:var(--mu2);font-weight:800;font-size:15px;text-align:center}
  .nm{grid-column:2;grid-row:1;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;min-width:0}
  .nm i{font-style:normal;font-weight:600;font-size:11px;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:1px 5px;flex:none}
  .nm s{text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .px{font-size:13px;color:var(--mu);margin-top:2px}
  .card .px{grid-column:2;grid-row:2}
  .px .u{color:var(--up)} .px .d{color:var(--dn)}
  .ring{grid-column:3;grid-row:1/3;position:relative;width:52px;height:52px}
  .ring svg{width:52px;height:52px;transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800}
  .ring small{position:absolute;left:0;right:0;bottom:-13px;text-align:center;font-size:10px;color:var(--mu)}
  .row2{grid-column:1/4;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .pills{display:flex;gap:4px}
  .pill{font-size:11px;padding:3px 6px;border-radius:7px;background:var(--card2);color:var(--mu);text-align:center;min-width:36px}
  .pill em{display:block;font-style:normal;font-weight:800;font-size:12.5px;color:var(--tx)}
  .pill.os{background:var(--ok-bg)} .pill.os em{color:var(--ok)}
  .pill.nr{background:var(--near-bg)} .pill.nr em{color:var(--near)}
  .pill.top{outline:1.5px solid var(--tx)}
  .st{font-size:12px;color:var(--mu);text-align:right;line-height:1.35}
  .st b{color:var(--tx);font-weight:700}
  .st .g{color:var(--sig)}
  .empty{color:var(--mu);text-align:center;padding:60px 10px;line-height:1.7}

  /* 상세 팝업 */
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.2s;z-index:20}
  .dim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:90vh;overflow:auto;background:#12171e;
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);
    padding:10px 18px 28px;max-width:560px;margin:0 auto}
  .sheet.on{transform:none}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
  .sh-h{display:flex;justify-content:space-between;align-items:flex-start}
  .sh-h h2{margin:0;font-size:22px;letter-spacing:-.03em}
  .sh-h .px{font-size:14px}
  .x{width:34px;height:34px;border-radius:10px;background:var(--card);display:grid;place-items:center}
  .scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 6px}
  .sc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .sc .l{font-size:12px;color:var(--mu)}
  .sc .v{font-size:26px;font-weight:800;margin-top:2px}
  .sc .v small{font-size:13px;color:var(--mu);font-weight:600;margin-left:4px}
  .sc.gold .v{color:var(--sig)}
  .sec{margin-top:18px}
  .sec h3{font-size:13px;color:var(--mu);font-weight:700;margin:0 0 8px}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:58px 1fr 40px;gap:8px;align-items:center;font-size:13px}
  .bar .t{color:var(--mu)}
  .bar .tr{height:8px;border-radius:4px;background:var(--card2);position:relative;overflow:hidden}
  .bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--mu2)}
  .bar .tr i.os{background:var(--ok)} .bar .tr i.nr{background:var(--near)}
  .bar .tr u{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.25)}
  .bar b{text-align:right}
  .chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 6px 4px}
  .chart svg{width:100%;height:auto;display:block}
  .chk{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .ck{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:13px;display:flex;gap:7px;align-items:center}
  .ck i{width:18px;height:18px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;flex:none;background:var(--card2);color:var(--mu2)}
  .ck.y i{background:var(--ok);color:#06261a}
  .info{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .info div{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;font-size:13.5px;border-top:1px solid var(--line)}
  .info div:first-child{border-top:0}
  .info span{color:var(--mu);flex:none}
  .info b{font-weight:600;text-align:right}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
  .btn{padding:13px 0;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-weight:700}
  .btn.p{background:var(--ok);color:#06261a;border-color:var(--ok)}
  .fld{width:100%;margin-top:8px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit}
  .hint{font-size:13px;color:var(--mu);line-height:1.6;margin-top:10px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);opacity:0;transition:.25s;background:#26303c;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:40}
  .toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>

    const x = X(i), y = Y(v);
    return `<circle cx="${x}" cy="${y}" r="4" fill="${col}" stroke="#12171e" stroke-width="2"/>
      <text x="${x}" y="${below ? y + 15 : y - 8}" text-anchor="middle" fill="${col}" font-size="10.5" font-weight="700">${t}</text>`;
  };
  g += mk(fm.i_l3, fm.l3p, "3파", "#36d399", true);
  g += mk(fm.i_h4, fm.h4, "4파", "#8a96a6", false);
  if (fm.below) g += mk(fm.i_low, fm.low, fm._sig ? "5파" : "5파?", "#ffcf5a", false);
  const last = s[s.length - 1];
  g += `<text x="${W - pr + 4}" y="${Y(last) + 4}" fill="#e8edf3" font-size="10">${fmt(last)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

function openDetail(code){
  if (!DATA){ PENDING = code; return; }
  const it = (DATA.items || []).find(x => x.code === code);
  if (!it) return;
  const fm = it.forming || {}, sg = it.sig, sf = FR[it.sframe] || "1일";
  const up = (it.chg || 0) >= 0;
  const bars = FR.map((f, k) => {
    const v = it.rsi[k], w = v == null ? 0 : Math.max(2, Math.min(100, v));
    return `<div class="bar"><span class="t">${f}${k === it.top ? " ◀" : ""}</span><div class="tr"><i class="${rcls(v)}" style="width:${w}%"></i><u style="left:30%"></u><u style="left:35%"></u></div><b>${v == null ? "-" : f1(v)}</b></div>`;
  }).join("");
  const C = (ok, t) => `<div class="ck ${ok ? "y" : ""}"><i>${ok ? "✓" : "–"}</i>${t}</div>`;
  const src = sg || {};
  const checks = sg
    ? [C(true,"RSI 다이버전스"), C(src.v3,"3파 거래량 급증"), C(src.vd,"거래량 다이버전스"), C(src.deep,"5파 깊이 충분"), C(src.zone,"피보 목표 구간"), C(src.ok4,"4파 되돌림 적정")]
    : [C(fm.l3p != null,"3파 저점 확인"), C(fm.v3,"3파 거래량 급증"), C(fm.below,"3파 저점 이탈"), C(fm.rsi_div,"RSI 다이버전스"), C(fm.vol_shrink,"거래량 감소"), C((fm.depth||0) >= 1.222,"5파 목표 도달")];
  let rows = "";
  if (sg){
    rows += `<div><span>3파 저점</span><b>${dt(sg.l3t)} · ${fmt(sg.l3p)}<br>${sg.l3c_name} · RSI ${f1(sg.l3r)} · 거래량 ${f1(sg.l3vr)}배</b></div>`;
    rows += `<div><span>4파 고점</span><b>${fmt(sg.h4)} <small style="color:var(--mu)">(1차 익절)</small></b></div>`;
    rows += `<div><span>5파 저점</span><b>${dt(sg.l5t)} · ${fmt(sg.l5p)}<br>${sg.l5c_name} · RSI ${f1(sg.l5r)} · 거래량 ${f1(sg.l5vr)}배</b></div>`;
    rows += `<div><span>5파 깊이</span><b>4파 반등폭의 ${f1(sg.depth)}배 · 되돌림 ${f1(sg.retr4)}</b></div>`;
  } else if (fm.l3p != null){
    rows += `<div><span>3파 저점</span><b>${dt(fm.l3t)} · ${fmt(fm.l3p)}<br>${fm.l3c_name || "-"} · RSI ${f1(fm.l3r)} · 거래량 ${f1(fm.l3vr)}배</b></div>`;
    rows += `<div><span>4파 고점</span><b>${dt(fm.h4t)} · ${fmt(fm.h4)}</b></div>`;
    rows += `<div><span>현재 저점</span><b>${dt(fm.lowt)} · ${fmt(fm.low)} · RSI ${f1(fm.low_r)}</b></div>`;
    rows += `<div><span>5파 목표</span><b>${fmt(fm.target_lo)} ~ ${fmt(fm.target_hi)}</b></div>`;
  } else {
    rows += `<div><span>구조</span><b>${sf}에서 RSI 과매도 + 거래량 급증 저점(3파)이 아직 없어요</b></div>`;
  }
  $("#sheet").innerHTML = `<div class="grab"></div>
    <div class="sh-h"><div><h2>${esc(it.name)}</h2><div class="px">${it.code} · ${it.market} · ${fmt(it.price)}원 <span class="${up ? "u" : "d"}">${up ? "+" : ""}${f1(it.chg)}%</span></div></div>
      <button class="x" id="cx">✕</button></div>
    <div class="scores">
      <div class="sc"><div class="l">준비 점수</div><div class="v">${it.ready}<small>/100</small></div></div>
      <div class="sc ${it.signal ? "gold" : ""}"><div class="l">매수 신호</div><div class="v">${it.signal ? it.signal + `<small>${grade(it.signal)} · ${FR[it.top]}</small>` : `–<small>미완성</small>`}</div></div>
    </div>
    <div class="sec"><h3>${sf} 차트 · 파동 구조</h3><div class="chart">${chartSvg(Object.assign({}, fm, {_sig: !!sg})) || `<div class="empty" style="padding:24px">차트 데이터 없음</div>`}</div></div>
    <div class="sec"><h3>프레임별 RSI <span style="font-weight:500">(점선 30 · 35)</span></h3><div class="bars">${bars}</div></div>
    <div class="sec"><h3>${sg ? "신호 조건" : "진행 상황"}</h3><div class="chk">${checks.join("")}</div></div>
    <div class="sec"><h3>파동 정보</h3><div class="info">${rows}</div></div>
    <div class="btns">
      <button class="btn" id="bn">네이버 차트</button>
      <button class="btn p" id="bt">트레이딩뷰</button>
    </div>`;
  $("#cx").onclick = closeSheet;
  $("#bn").onclick = () => openUrl(`https://m.stock.naver.com/domestic/stock/${it.code}/total`);
  $("#bt").onclick = () => openUrl(`https://www.tradingview.com/chart/?symbol=KRX%3A${it.code}`);
  showSheet();
}

function openSettings(){
  $("#sheet").innerHTML = `<div class="grab"></div>
    <div class="sh-h"><h2>설정</h2><button class="x" id="cx">✕</button></div>
    <div class="sec"><h3>GitHub 저장소</h3>
      <input class="fld" id="repo" placeholder="아이디/저장소이름  예) sangwoo/divergence-scanner" value="${esc(getRepo())}" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="hint">스캐너를 올린 공개 저장소예요. 주소창의 github.com/ 뒤에 있는 부분을 그대로 넣으면 돼요.<br>위젯도 같은 저장소에서 매시간 결과를 가져와요.</div>
    </div>
    <div class="btns"><button class="btn" id="clr">예시로 보기</button><button class="btn p" id="sv">저장</button></div>`;
  $("#cx").onclick = closeSheet;
  $("#sv").onclick = () => { let v = $("#repo").value.trim().replace(/^https?:\/\/github\.com\//, "").replace(/\/+$/, ""); setRepo(v); closeSheet(); toast("저장했어요"); load(); };
  $("#clr").onclick = () => { setRepo(""); closeSheet(); load(); };
  showSheet();
}

function showSheet(){ $("#dim").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").scrollTop = 0; }
function closeSheet(){ $("#dim").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#dim").onclick = closeSheet;
$("#rf").onclick = load;
$("#set").onclick = openSettings;
document.querySelectorAll(".tab").forEach(b => b.onclick = () => { document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === b)); TAB = b.dataset.t; render(); });
document.querySelectorAll(".chip").forEach(b => b.onclick = () => { document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b)); MKT = b.dataset.m; render(); });

window.openCode = code => { if (DATA) openDetail(code); else PENDING = code; };
window.onBack = () => { if ($("#sheet").classList.contains("on")) { closeSheet(); return true; } return false; };
window.reload = load;
try { const c = new URLSearchParams(location.search).get("code"); if (c) PENDING = c; } catch(e){}
load();
</script>
</body>
</html>
